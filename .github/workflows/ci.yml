name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client
      - name: Build frontend
        run: npm run build --prefix client
      - name: Lint frontend
        run: npm run lint --prefix client
      - name: Install backend dependencies
        run: npm ci --prefix server --legacy-peer-deps
      - name: Seed isolated test database
        run: npm run seed --prefix server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/eventpulse_test
      - name: Run backend integration tests
        run: npm test --prefix server
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/eventpulse_test
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-for-production
